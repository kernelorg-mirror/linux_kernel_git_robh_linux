%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/ti,omap34xx-bandgap.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TI OMAP SCM Bandgap

maintainers:
  - Eduardo Valentin <eduardo.valentin@ti.com>
  - Eduardo Valentin <edubezval@gmail.com>
  - Pavel Machek <pavel@ucw.cz>

description:
  In the System Control Module, OMAP supplies a voltage reference and a
  temperature sensor feature that are gathered in the band gap voltage and
  temperature sensor (VBGAPTS) module. The band gap provides current and voltage
  reference for its internal circuits and other analog IP blocks. The
  analog-to-digital converter (ADC) produces an output value that is
  proportional to the silicon temperature.

allOf:
  - $ref: thermal-sensor.yaml#

properties:
  compatible:
    items:
      - enum:
          - ti,omap34xx-bandgap
          - ti,omap36xx-bandgap
          - ti,omap4430-bandgap
          - ti,omap4460-bandgap
          - ti,omap4470-bandgap
          - ti,omap5430-bandgap
          - ti,dra752-bandgap

  reg:
    minItems: 1
    maxItems: 6

  interrupts:
    maxItems: 1
    description: Interrupt specifier for the talert signal.

  gpios:
    description: GPIO specifier for the tshut signal, treated as an IRQ.
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    bandgap {
        compatible = "ti,omap4460-bandgap";
        reg = <0x4a002260 0x4>,
              <0x4a00232C 0x4>,
              <0x4a002378 0x18>;
        interrupts = <0 126 4>;
        gpios = <&gpio3 22 0>;
        #thermal-sensor-cells = <1>;
    };
