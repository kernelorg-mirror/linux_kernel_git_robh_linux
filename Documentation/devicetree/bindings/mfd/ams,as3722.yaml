%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/ams,as3722.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ams,as3722 Power management IC.

maintainers:
  - Guenter Roeck <linux@roeck-us.net>
  - Laxman Dewangan <ldewangan@nvidia.com>
  - Marcel Ziswiler <marcel.ziswiler@toradex.com>

properties:
  compatible:
    const: ams,as3722

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  '#gpio-cells':
    const: 2

  gpio-controller: true

  '#interrupt-cells':
    const: 2

  interrupt-controller: true

  ams,system-power-controller:
    type: boolean

  pinmux:
    type: object
    additionalProperties: false

    patternProperties:
      '^gpio':
        type: object
        $ref: /schemas/pinctrl/pincfg-node.yaml

        properties:
          pins:
            items:
              pattern: '^gpio[0-7]$'

          function:
            enum: [ gpio, interrupt-out, gpio-in-interrupt,
                    vsup-vbat-low-undebounce-out, vsup-vbat-low-debounce-out,
                    voltage-in-standby, oc-pg-sd0, oc-pg-sd6, powergood-out,
                    pwm-in, pwm-out, clk32k-out, watchdog-in, soft-reset-in
            ]

  regulators:
    description: Container node for regulator supplies and subnodes
    type: object
    additionalProperties: false

    properties:
      vsup-sd2-supply:
        description: Input supply for SD2

      vsup-sd3-supply:
        description: Input supply for SD3

      vsup-sd4-supply:
        description: Input supply for SD4

      vsup-sd5-supply:
        description: Input supply for SD5

      vin-ldo0-supply:
        description: Input supply for LDO0

      vin-ldo1-6-supply:
        description: Input supply for LDO1 and LDO6

      vin-ldo2-5-7-supply:
        description: Input supply for LDO2, LDO5 and LDO7

      vin-ldo3-4-supply:
        description: Input supply for LDO3 and LDO4

      vin-ldo9-10-supply:
        description: Input supply for LDO9 and LDO10

      vin-ldo11-supply:
        description: Input supply for LDO11

    patternProperties:
      '^(sd[0-6]|ldo([0-7]|9|10|11))$':
        description: Configuration for each regulator sub-node
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false

        properties:
          ams,ext-control:
            description: >
              External control of the rail. Valid values:

                0 = no external control
                1 = ENABLE1
                2 = ENABLE2
                3 = ENABLE3

              Missing this property on DT will be assumed as no external control.
              The external control pin macros are defined in dt-bindings/mfd/as3722.h
            $ref: /schemas/types.yaml#/definitions/uint32
            enum: [0, 1, 2, 3]

          ams,enable-tracking:
            description: Enable tracking with SD1, only supported by LDO3
            type: boolean

        required:
          - regulator-name
          - regulator-min-microvolt
          - regulator-max-microvolt

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@40 {
            compatible = "ams,as3722";
            reg = <0x40>;

            regulators {
                vsup-sd2-supply = <&vdd_ddr>;
                vin-ldo3-4-supply = <&vdd_sys>;

                sd0 {
                    regulator-name = "vdd_cpu";
                    regulator-min-microvolt = <700000>;
                    regulator-max-microvolt = <1400000>;
                    regulator-always-on;
                    ams,ext-control = <2>;
                };

                sd1 {
                    regulator-name = "vdd_core";
                    regulator-min-microvolt = <700000>;
                    regulator-max-microvolt = <1400000>;
                    regulator-always-on;
                    ams,ext-control = <1>;
                };

                sd2 {
                    regulator-name = "vddio_ddr";
                    regulator-min-microvolt = <1350000>;
                    regulator-max-microvolt = <1350000>;
                    regulator-always-on;
                };

                ldo3 {
                    regulator-name = "avdd-hdmi-pex";
                    regulator-min-microvolt = <1050000>;
                    regulator-max-microvolt = <1050000>;
                    regulator-always-on;
                    ams,enable-tracking;
                };
            };
        };
    };
