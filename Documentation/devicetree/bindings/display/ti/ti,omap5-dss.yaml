%YAML 1.2
---
$id: http://devicetree.org/schemas/display/ti/ti,omap5-dss.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments OMAP5 Display Subsystem

maintainers:
  - Peter Ujfalusi <peter.ujfalusi@ti.com>

description: |
  Texas Instruments OMAP5 Display Subsystem

  See Documentation/devicetree/bindings/display/ti/ti,omap-dss.txt for generic
  description about OMAP Display Subsystem bindings.

properties:
  compatible:
    const: ti,omap5-dss

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: fck

  DISPC:
    description: Display controller
    type: object
    additionalProperties: false

    properties:
      compatible:
        const: ti,omap5-dispc

      reg:
        maxItems: 1

      interrupts:
        maxItems: 1

      clocks:
        maxItems: 1

      clock-names:
        items:
          - const: fck

      max-memory-bandwidth:
        description: Input memory (from main memory to DISPC) bandwidth limit in bytes per second
        $ref: /schemas/types.yaml#/definitions/uint32

    required:
      - compatible
      - reg
      - interrupts
      - clocks
      - clock-names

  RFBI:
    description: Raster frame buffer interface
    type: object

    properties:
      compatible:
        items:
          - const: ti,omap5-rfbi

      reg:
        description: Base address and length of the RFBI register space
        items:
          - description: RFBI registers

      clocks:
        description: Clocks used by RFBI

      clock-names:
        items:
          - const: fck
          - const: ick

    required:
      - compatible
      - reg
      - clocks
      - clock-names

    additionalProperties: false

  DSI:
    description: Display Serial Interface controller
    type: object

    properties:
      compatible:
        items:
          - const: ti,omap5-dsi

      reg:
        items:
          - description: proto registers
          - description: phy registers
          - description: pll registers

      reg-names:
        items:
          - const: proto
          - const: phy
          - const: pll

      vdd-supply: true

      clocks:
        maxItems: 2

      clock-names:
        items:
          - const: fck
          - const: sys_clk

    required:
      - compatible
      - reg
      - reg-names
      - ti,hwmods
      - vdd-supply
      - clocks
      - clock-names

    additionalProperties: false

  HDMI:
    description: HDMI transmitter
    type: object

    properties:
      compatible:
        items:
          - const: ti,omap5-hdmi

      reg:
        items:
          - description: wp registers
          - description: pll registers
          - description: phy registers
          - description: core registers

      reg-names:
        items:
          - const: wp
          - const: pll
          - const: phy
          - const: core

      interrupts:
        maxItems: 1

      vdda-supply: true

      clocks:
        maxItems: 1

      clock-names:
        items:
          - const: fck
          - const: sys_clk

    required:
      - compatible
      - reg
      - reg-names
      - interrupts
      - vdda-supply
      - clocks
      - clock-names

    additionalProperties: false

required:
  - compatible
  - reg
  - ti,hwmods
  - clocks
  - clock-names
  - DISPC

additionalProperties: false

examples:
  - |
    dss: display-subsystem@4a000000 {
      compatible = "ti,omap5-dss";
      reg = <0x4a000000 0x1000>;
      ti,hwmods = "dss_core";
      clocks = <&fclk>;
      clock-names = "fck";
      DISPC: dispc@4a002000 {
        compatible = "ti,omap5-dispc";
        reg = <0x4a002000 0x1000>;
        ti,hwmods = "dss_dispc";
        interrupts = <72>;
        clocks = <&fclk>;
        clock-names = "fck";
      };
    };
